<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>

    <header>
        <h1 style="text-align: center; color:blue">Hospital PUCE - FORMULARIO</h1>
        <p style="text-align: center; font-size: 20px;">Tu hospital de confianza!</p>
        <hr>
    </header>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/pages/formulario.html">Formulario</a>
        <a href="https://www.puce.edu.ec/servicios/pucesalud/" target="_blank">Pagina oficial de la PUCE</a>
        <hr>
    </nav>
    
    <!--Formulario de registro pacientes PUCE-->
    <form action="#">
        <label for="nombre">Ingrese su nombre</label>
        <br>
        <input type="text" id="nombre" placeholder="nombre" size="10" required>
        <br><br>
        <label for="apellidos">Ingrese sus 2 apellidos</label>
        <br>
        <input type="text" id="apellidos" placeholder="apellidos" size="10" required>
        <br><br>
        <label for="email">Ingrese su correo electronico</label>
        <br>
        <input type="email" id="email" placeholder="email" size="10" required>
        <br><br>
        <label for="direccion">Dirección domiciliaria:</label>
        <br>
        <input type="text" id="direccion" placeholder="direccion" required>
        <br><br>
        <label for="cedula">Número de identificación:</label>
        <br>
        <input type="text" id="cedula" placeholder="numero de identificación" required>
        <br><br>
        
        <label for="foto">Foto de su cedula</label>
        <br>
        <input type="file" id="foto">
        <br><br>
        <label for="telefono">Teléfono:</label>
        <br>
        <input type="tel" id="telefono" placeholder="telefono celular"  required>
        <br><br>
        <label for="codigo_paciente">Codigo de paciente</label>
        <br>
        <input type="password" id="codigo_paciente" placeholder="codigo de paciente" required>
        <br><br>
        <label for="fecha_nacimiento">Ingrese su fecha de nacimiento</label>
        <br>
        <input type="date" id="fecha_nacimiento" placeholder="fecha de cumpleaños" required>
        <br><br>
        <label for="malestar">Cuantos dias tiene de malestar?</label>
        <br>
        <input type="number" id="malestar" placeholder="dias de malestar" required>
        <br><br>
        <label for="#">Género</label>
        <br>
        <label for="masculino">
        <input type="radio" id="masculino" name="genero">Masculino</label>
        <label for="femenino">
        <input type="radio" id="femenino" name="genero">Femenino</label>
        <br><br>
        <label for="ciudad">Seleccione su ciudad</label>
        <select name="ciudad" id="ciudad">
            <option value="opcion" disabled selected>Seleccionar opcion</option>
            <option value="quito">Quito</option>
            <option value="ambato">Ambato</option>
            <option value="guayaquil">Guayaquil</option>
            <option value="loja">Loja</option>
            <option value="ibarra">Ibarra</option>
            <option value="cuenca">Cuenca</option>
            <option value="otro">Otro</option>
        </select>
        <br><br>
        <label for="consulta">Motivo de consulta</label>
        <br>
        <textarea name="consulta" id="consulta" cols="50" rows="10" placeholder="Escriba el motivo de su consulta..."></textarea>
        <br> <br>
        <label for="antecedentes">Antecedentes médicos:</label>
        <br><br>
        <textarea id="antecedentes" placeholder="antecedentes médicos" required cols="50" rows="10"></textarea>

        <br>
        <label for="colorojos">Color de ojos</label>
        <br>
        <input type="color" id="color" name="color">
        <br>    <br>
        <input type="submit" value="Enviar">
        <br> <br>
        <button type="reset">Limpiar</button>
    </form>
    





</body>

</html>
